{%extends 'main.html' %}

{% block title%} myapp-Registration Form {%endblock title%}
{% block top%}

<a href="{% url 'myapp:login' %}">Login</a> 
{%endblock %}
{% block content %}
<div class="all-forms">
    <form action="{% url 'myapp:storeCandidate' %}" method="post">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" name="username">
        <label for="password">Password</label>
        <input type="password" name="password">
        <label for="name">Name</label>
        <input type="text" name="name">


        <input type="submit" value="Submit">
        <input type="reset" valur="Clear">

    </form>
    Already have an account, <a href="{% url 'myapp:login' %}">Click here</a>
</div>
{% endblock %}
