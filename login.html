{% extends 'main.html' %}

{% block title%} myapp - login Form {%endblock title%}
{% block top%}
<a href="{% url 'myapp:registrationForm' %}">Signup</a>
 
{%endblock %}
{% block content %}
<div class="all-forms">
      {% if loginError%}
      <div id="error">{{loginError}}</div>
      {% endif %}
    <form action="{% url 'myapp:login' %}" method="POST">
       {% csrf_token %}
       <div class="form-unit">
        <label for="username">Username</label>
        <input type="text" name="username">
       </div>
       <div class="form-unit">
        <label for="password">Password</label>
        <input type="password" name="password">
       </div>
       <div class="form-unit">
        <input type="submit" value="login">
        <input type="reset" value="Clear">
       </div>
    </form>
    New user<a href="{% url 'myapp:registrationForm' %}">Click Here</a>
</div>
{% endblock %}
